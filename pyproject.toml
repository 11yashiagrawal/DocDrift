[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docdrift"
version = "0.1.0"
description = "Find documentation sentences made stale by code changes in a pull request."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
docdrift = "docdrift.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
